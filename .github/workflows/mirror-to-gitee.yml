name: Mirror to Gitee

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -e
          AUTH=$(printf '%s:%s' "$GITEE_USERNAME" "$GITEE_TOKEN" | base64 -w0)
          git -c http.extraheader="Authorization: Basic $AUTH" push https://gitee.com/james_yu/all-in-rag.git --all
          git -c http.extraheader="Authorization: Basic $AUTH" push https://gitee.com/james_yu/all-in-rag.git --tags
